name: Update Landscape
on:
  push:
    branches: [main]
    paths:
      - 'org.yaml'
      - 'project.yaml'
      - '*/project.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Update Landscape
        uses: cncf/automation/.github/actions/landscape-update@main
        with:
          token: ${{ secrets.LANDSCAPE_REPO_TOKEN }}
