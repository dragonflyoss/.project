name: Validate Project Metadata

on:
  pull_request:
    paths:
      - 'org.yaml'
      - 'project.yaml'
      - 'maintainers.yaml'
      - '*/project.yaml'
      - '*/maintainers.yaml'
  push:
    branches: [main]
    paths:
      - 'org.yaml'
      - 'project.yaml'
      - 'maintainers.yaml'
      - '*/project.yaml'
      - '*/maintainers.yaml'
  workflow_dispatch:

jobs:
  validate-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: cncf/automation/.github/actions/validate-project@85e0bcd298817a6e26e286d6b22615f8c81b4e4b
        with:
          check_links: 'true'

  validate-maintainers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: cncf/automation/.github/actions/validate-maintainers@85e0bcd298817a6e26e286d6b22615f8c81b4e4b
        with:
          verify_maintainers: 'false'
          check_links: 'true'
        env:
          LFX_AUTH_TOKEN: ${{ secrets.LFX_AUTH_TOKEN }}
