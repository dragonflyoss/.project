name: Validate Project Metadata

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate.yaml"
      - "org.yaml"
      - "project.yaml"
      - "maintainers.yaml"
      - "*/project.yaml"
      - "*/maintainers.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: cncf/automation/.github/actions/validate-project@main
        with:
          check_links: "true"

  validate-maintainers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: cncf/automation/.github/actions/validate-maintainers@main
        with:
          verify_maintainers: "false"
          check_links: "true"
        env:
          LFX_AUTH_TOKEN: ${{ secrets.LFX_AUTH_TOKEN }}
